{% extends "myapp/base.html" %}

{% block content %}
    <div class="flex justify-center items-center min-h-screen p-6">
        <div class="text-center bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
            <!-- Аватар -->
            <div class="mb-4">
                {% load static %}
                {% if user.profile and user.profile.image %}
                    <img 
                        class="h-80 w-80 mx-auto rounded-full object-cover border-4 border-gray-200" 
                        src="{{ user.profile.image.url }}" 
                        alt="Аватар пользователя" 
                        onerror="this.src='{% static 'myapp/images/default_avatar.png' %}'"
                    >
                {% else %}
                    <img 
                        class="h-80 w-80 mx-auto rounded-full object-cover border-4 border-gray-200" 
                        src="{% static 'myapp/images/default_avatar.png' %}" 
                        alt="Аватар по умолчанию"
                    >
                {% endif %}
            </div>
            <!-- Имя пользователя -->
            <h1 class="font-bold text-xl">{{ user.username }}</h1>
        </div>
    </div>
{% endblock content %}
